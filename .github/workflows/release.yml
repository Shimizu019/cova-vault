name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0-beta)"
        required: true
        default: "v0.1.0-beta"

permissions:
  contents: write
env:
  JAVA_TOOL_OPTIONS: "-Xbootclasspath/a:/home/runner/.jaxb/jaxb-api.jar:/home/runner/.jaxb/jaxb-runtime.jar:/home/runner/.jaxb/jaxb-core.jar:/home/runner/.jaxb/istack-commons-runtime.jar:/home/runner/.jaxb/javax.activation.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Package web build
        run: cd dist && zip -r ../cova-vault.zip .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Download JAXB for Java 11+ compatibility
        run: |
          mkdir -p ~/.jaxb
          curl -sL -o ~/.jaxb/jaxb-api.jar https://repo1.maven.org/maven2/javax/xml/bind/jaxb-api/2.3.1/jaxb-api-2.3.1.jar
          curl -sL -o ~/.jaxb/jaxb-runtime.jar https://repo1.maven.org/maven2/org/glassfish/jaxb/jaxb-runtime/2.3.1/jaxb-runtime-2.3.1.jar
          curl -sL -o ~/.jaxb/jaxb-core.jar https://repo1.maven.org/maven2/org/glassfish/jaxb/jaxb-core/2.3.0.1/jaxb-core-2.3.0.1.jar
          curl -sL -o ~/.jaxb/istack-commons-runtime.jar https://repo1.maven.org/maven2/com/sun/istack/istack-commons-runtime/3.0.1/istack-commons-runtime-3.0.1.jar
          curl -sL -o ~/.jaxb/javax.activation.jar https://repo1.maven.org/maven2/com/sun/activation/javax.activation/1.2.0/javax.activation-1.2.0.jar
          echo "JAXB downloaded: $(ls -la ~/.jaxb/)"
        shell: bash

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0 platforms;android-36"

      - name: Sync Capacitor
        run: npx cap sync android
        shell: bash

      # Android only accepts an APK as an update of an installed app when the
      # applicationId, a strictly greater versionCode, and the signing
      # certificate all match. The version values are therefore derived from the
      # release tag in one deterministic place instead of an arbitrary CI run
      # number: v0.1.8-beta -> 108, v0.1.9-beta -> 109, v0.2.0 -> 200.
      - name: Resolve Android version
        id: android_version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "::error::No release tag available; cannot derive the Android version."
            exit 1
          fi
          VERSION_NAME="${TAG#v}"
          node scripts/android-version.mjs --name "$VERSION_NAME" >> "$GITHUB_OUTPUT"
        shell: bash


      - name: Build debug APK
        id: build_apk
        env:
          COVA_VERSION_NAME: ${{ steps.android_version.outputs.versionName }}
          COVA_VERSION_CODE: ${{ steps.android_version.outputs.versionCode }}
        run: |
          echo "Building debug APK with versionName=$COVA_VERSION_NAME versionCode=$COVA_VERSION_CODE"
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug -x lint --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "build_exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          echo "=== Debug APK files ==="
          find . -path '*outputs/apk/debug*' -name '*.apk' -type f 2>/dev/null || echo "No debug APK files found"
          exit "$BUILD_EXIT"
        shell: bash

      - name: Save build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log

      - name: Set APK path
        id: find_apk
        if: steps.build_apk.outcome == 'success'
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -1 || true)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android -path '*outputs/apk/debug*' -name '*.apk' -type f 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Build succeeded but no debug APK was produced."
            exit 1
          fi
          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"
        shell: bash

      # Guards the installation preconditions before anything is published:
      # applicationId, versionName/versionCode, and signature validity.
      - name: Verify APK identity
        if: steps.build_apk.outcome == 'success' && steps.find_apk.outcome == 'success'
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          EXPECTED_NAME="${{ steps.android_version.outputs.versionName }}"
          EXPECTED_CODE="${{ steps.android_version.outputs.versionCode }}"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not produced; refusing to publish a release without it."
            exit 1
          fi

          echo "=== APK: $APK_PATH ==="
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          if [ ! -x "$AAPT" ]; then AAPT="$BUILD_TOOLS/aapt2"; fi
          if [ ! -x "$AAPT" ]; then AAPT="$(command -v aapt || true)"; fi

          BADGING=""
          if [ -n "$AAPT" ] && [ -x "$AAPT" ]; then
            BADGING=$("$AAPT" dump badging "$APK_PATH" 2>/dev/null || true)
          fi

          if [ -n "$BADGING" ]; then
            echo "$BADGING" | head -3
            echo "$BADGING" | grep -q "package: name='com.cova.vault'" || { echo "::error::APK applicationId is not com.cova.vault"; exit 1; }
            echo "$BADGING" | grep -q "versionCode='$EXPECTED_CODE'" || { echo "::error::APK versionCode is not the expected $EXPECTED_CODE"; exit 1; }
            echo "$BADGING" | grep -q "versionName='$EXPECTED_NAME'" || { echo "::error::APK versionName is not the expected $EXPECTED_NAME"; exit 1; }
          else
            echo "::warning::No aapt/aapt2 available to read APK badging; skipped the metadata assertions."
          fi

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK; cannot verify signature."
            exit 1
          fi

          echo "=== Signer certificate ==="
          set +e
          "$APKSIGNER" verify --print-certs "$APK_PATH" > apksigner-report.txt 2>&1
          SIGNER_EXIT=$?
          set -e
          head -12 apksigner-report.txt

          if [ "$SIGNER_EXIT" -ne 0 ]; then
            echo "::error::apksigner rejected the APK (exit $SIGNER_EXIT): it is unsigned or the signature is invalid."
            exit 1
          fi

          CERT_SHA=$(grep -i 'certificate SHA-256 digest' apksigner-report.txt | head -1 | awk '{print $NF}' || true)
          echo "Debug APK signed successfully ($CERT_SHA)."
        shell: bash

      - name: Set up GitHub CLI
        if: always()
        shell: bash
        run: |
          echo "GH CLI: $(command -v gh || echo MISSING)"
          if command -v gh >/dev/null 2>&1; then gh --version; fi

      - name: Create GitHub Release
        if: success()
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          BUILD_EXIT="${{ steps.build_apk.outputs.build_exit_code }}"
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"

          case "$TAG" in
            v0.1.1-beta)
              CHANGELOG=$'Fixed mobile storage initialization to prevent crashes\nImproved configuration file formatting\nUpdated APK naming to include the version tag'
              ;;
            v0.1.2-beta)
              CHANGELOG=$'Fixed fire-and-forget writes in native storage adapter (Preferences.set was not awaited)\nAdded fallback read from Capacitor Preferences if cache miss\nFixed async getItem in authStorage and vaultStorage'
              ;;
            v0.1.3-beta)
              CHANGELOG=$'Fixed critical persistence bugs causing data loss on app restart:\n- Fire-and-forget writes in native storage (Preferences.set/remove now awaited)\n- Missing await in vaultStorage.setItem, getOrCreateVaultSalt, setVaultSalt, reencryptVault\n- Added comprehensive debug logging across storage, vaultStorage, encryptedPersist, and Lock rehydration\n- Manual rehydrateStores() after vault unlock with detailed per-store logging\n- Fixed store initialization timing: initStorage() now runs before any store imports via dynamic import'
              ;;
            v0.1.4-beta)
              CHANGELOG=$'Fixed critical data persistence bug causing all user data (Credentials, Wallet, Savings, Notes, Tasks) to disappear after app restart:\n- Root cause: Zustand persist middleware calls storage.setItem() synchronously, but native Capacitor Preferences writes were async and fire-and-forget\n- Fix: Native storage adapter now synchronous with background write queue - caches immediately, queues Preferences.set() for async completion\n- All 5 data stores (Credentials, Notes, Tasks, Wallet, Savings) now persist correctly across full app termination/restart\n- Added comprehensive debug logging to trace: store name, key, save started/completed, item count, native write success/failure, encryption/decryption, rehydration'
              ;;
            v0.1.8-beta)
              CHANGELOG=$'Persistence diagnostics: verify the save → logout → restart → unlock lifecycle on-device\n- New Settings → Diagnostics section and standalone /diagnostics page reachable from the Lock screen\n- 3-phase probe: Phase 1 writes sample data + logs out, Phase 2 verifies native storage after force-close (before unlock), Phase 3 verifies rehydration after unlock\n- Stage-by-stage pass/fail for: native write, Preferences.read, decrypt, store rehydrate, UI display — with no secrets logged\n- Raw Capacitor Preferences inspection table with presence/size/hash per storage key\n- Build identity stamping: every APK/footer now shows version, build number, commit SHA, and build time\n- APK versionCode/versionName now stamped from the release tag in CI\n- Fixed mojibake characters in Wallet (₱ peso sign, · separator)'
              ;;
            v0.1.0)
              CHANGELOG=$'PeraLog: category-specific Add Expense form\n- Category is now the first field when adding an Expense transaction\n- Description examples adapt to the selected category (Food: Burger, Fried Chicken, Rice, Coffee; Transportation: Jeep, Tricycle, Bus, Taxi, UV Express, Motorcycle; plus examples for every other expense category)\n- Amount label is now category-specific: Price Food, Price Transportation, Price School, and so on\n- Cash Given, Date, Time, Note, balance calculations, history, and the Income form are unchanged\n- First stable, official release of Cova Vault'
              ;;
            v0.1.1)
              CHANGELOG=$'Account/Profile: explicit Save Changes flow (no more auto-save while editing)\n- Name, Display Name, Email, and Profile Picture now edit a temporary draft instead of updating the saved account on every keystroke\n- Added a Save Changes button; the saved account only updates after the user clicks it\n- The button is disabled and shows "No Changes" when there are no unsaved edits\n- Avatar selection now stages into the draft and commits together with the other fields on save\n- Master-password change flow is unchanged and stays separate'
              ;;
            *)
              CHANGELOG=$'Bug fixes and improvements'
              ;;
          esac

          echo "=== Releasing tag: $TAG ==="
          echo "BUILD_EXIT_CODE: $BUILD_EXIT"
          echo "APK_PATH: '$APK_PATH'"
          echo "GH CLI: $(command -v gh || echo MISSING)"
          gh --version

          echo "1. Deleting existing release if it exists..."
          gh release delete "$TAG" --yes 2>&1 || echo "No existing release to delete (expected)"

          echo "2. Creating new release..."
          if [[ "$TAG" == *-beta* ]]; then
            {
              echo "Welcome to Cova Vault $TAG"
              echo "This is a beta testing release of Cova Vault: a secure, all-in-one personal vault app for passwords, notes, tasks, finances, savings goals, and more."
              echo ""
              echo "This beta build is being shared to test features and find remaining issues. Some features may still change."
              echo ""
              echo "What is Cova Vault?"
              echo "Cova Vault is a privacy-focused personal vault application. It runs locally on your device with no cloud sync required."
              echo ""
              echo "Main Features"
              echo "- Credentials: store and manage passwords securely"
              echo "- Notes: keep quick notes, ideas, and references"
              echo "- Tasks: track to-dos and schedules"
              echo "- PeraLog (Finance): track income, expenses, budgets, and balance"
              echo "- Savings: set savings goals and monitor progress"
              echo "- Folders: organize everything with easy navigation"
              echo "- Favorites: quick access to most-used items"
              echo "- Calendar and Schedule: keep track of dates and deadlines"
              echo "- Password Generator: create strong, secure passwords"
              echo "- Activity Log: see everything happening in your vault"
              echo "- Mobile-Ready: works on phones and tablets"
              echo ""
              echo "What is New in $TAG"
              echo "$CHANGELOG"
              echo ""
              echo "Persistence verification"
              echo "The five-store regression passes with real stores and encryption across separate Node processes using mock Capacitor Preferences. Android native storage and the installed APK force-close test have NOT yet been verified on a real device."
              echo ""
              echo "Beta Notice"
              echo "This is a beta release. Please report any issues you find."
            } > release-notes.md
          else
            {
              echo "Cova Vault $TAG: Official Release"
              echo "A secure, all-in-one personal vault app for passwords, notes, tasks, finances, savings goals, and more."
              echo ""
              echo "After several beta iterations, Cova Vault is now ready for everyday use. Thank you to everyone who tested the beta builds."
              echo ""
              echo "What is Cova Vault?"
              echo "Cova Vault is a privacy-focused personal vault application. It runs locally on your device with no cloud sync required."
              echo ""
              echo "Main Features"
              echo "- Credentials: store and manage passwords securely"
              echo "- Notes: keep quick notes, ideas, and references"
              echo "- Tasks: track to-dos and schedules"
              echo "- PeraLog (Finance): track income, expenses, budgets, and balance"
              echo "- Savings: set savings goals and monitor progress"
              echo "- Folders: organize everything with easy navigation"
              echo "- Favorites: quick access to most-used items"
              echo "- Calendar and Schedule: keep track of dates and deadlines"
              echo "- Password Generator: create strong, secure passwords"
              echo "- Activity Log: see everything happening in your vault"
              echo "- Mobile-Ready: works on phones and tablets"
              echo ""
              echo "What is New in $TAG"
              echo "$CHANGELOG"
              echo ""
              echo "Downloads"
              echo "- cova-vault.zip: web build (host it on any static server)"
              echo "- app-CovaVault-$TAG.apk: Android app"
              echo ""
              echo "Thank you for using Cova Vault! Please report any issues you find."
            } > release-notes.md
          fi

          RELEASE_FLAGS=()
          if [[ "$TAG" == *-beta* ]]; then RELEASE_FLAGS+=(--prerelease); fi
          gh release create "$TAG" --title "Cova $TAG" -F release-notes.md "${RELEASE_FLAGS[@]}" 2>&1

          echo "3. Uploading web build..."
          gh release upload "$TAG" cova-vault.zip --clobber 2>&1

          echo "4. Uploading APK (if exists)..."
          if [ -n "${APK_PATH:-}" ] && [ -f "$APK_PATH" ]; then
            echo "   APK found: $APK_PATH"
            APK_NAME="app-CovaVault-${TAG}.apk"
            cp "$APK_PATH" "$APK_NAME"
            gh release upload "$TAG" "$APK_NAME" --clobber 2>&1
          else
            echo "   No APK to upload (expected if build failed)"
          fi

          echo "=== Release created ==="
          gh release view "$TAG" --json name,assets 2>&1
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name || inputs.tag }}
