name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0-beta)'
        required: true
        default: 'v0.1.0-beta'

permissions:
  contents: write
env:
  JAVA_TOOL_OPTIONS: "-Xbootclasspath/a:/home/runner/.jaxb/jaxb-api.jar:/home/runner/.jaxb/jaxb-runtime.jar:/home/runner/.jaxb/jaxb-core.jar:/home/runner/.jaxb/istack-commons-runtime.jar:/home/runner/.jaxb/javax.activation.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Package web build
        run: cd dist && zip -r ../cova-vault.zip .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download JAXB for Java 17 compatibility
        run: |
          mkdir -p ~/.jaxb
          curl -sL -o ~/.jaxb/jaxb-api.jar https://repo1.maven.org/maven2/javax/xml/bind/jaxb-api/2.3.1/jaxb-api-2.3.1.jar
          curl -sL -o ~/.jaxb/jaxb-runtime.jar https://repo1.maven.org/maven2/org/glassfish/jaxb/jaxb-runtime/2.3.1/jaxb-runtime-2.3.1.jar
          curl -sL -o ~/.jaxb/jaxb-core.jar https://repo1.maven.org/maven2/org/glassfish/jaxb/jaxb-core/2.3.0.1/jaxb-core-2.3.0.1.jar
          curl -sL -o ~/.jaxb/istack-commons-runtime.jar https://repo1.maven.org/maven2/com/sun/istack/istack-commons-runtime/3.0.1/istack-commons-runtime-3.0.1.jar
          curl -sL -o ~/.jaxb/javax.activation.jar https://repo1.maven.org/maven2/com/sun/activation/javax.activation/1.2.0/javax.activation-1.2.0.jar
          echo "JAXB downloaded: $(ls -la ~/.jaxb/)"
        shell: bash

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'

      - name: Sync Capacitor
        run: npx cap sync android
        shell: bash

      - name: Build APK
        id: build
        run: |
          cd android
          chmod +x ./gradlew
          set +e
          ./gradlew assembleRelease -x lint --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          echo "BUILD_EXIT_CODE=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          echo "=== Searching for ALL apk files in android/ ==="
          APK_FOUND=$(find . -name '*.apk' -type f 2>/dev/null || true)
          echo "APK_FILES: '$APK_FOUND'"
          if [ -n "$APK_FOUND" ]; then
            echo "::warning::APK found: $APK_FOUND"
          else
            echo "::warning::No APK files found anywhere in android/"
            echo "=== Checking build dirs ==="
            ls -la app/build/outputs/ 2>/dev/null || echo "No outputs dir"
            ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"
            ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release apk dir"
          fi
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::APK BUILD FAILED (exit code $BUILD_EXIT). Last 50 lines:"
            tail -50 gradle-build.log | while IFS= read -r line; do
              echo "::error::gradle: $line"
            done
          fi
        shell: bash

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log

      - name: Set APK path
        id: find_apk
        if: always()
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1 || true)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android -name '*.apk' -type f 2>/dev/null | head -1 || true)
          fi
          echo "APK_PATH: '$APK_PATH'"
          echo "apk_path=${APK_PATH:-}" >> "$GITHUB_OUTPUT"
          echo "APK_PATH=$APK_PATH"
        shell: bash

      - name: Create GitHub Release
        if: always()
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          BUILD_EXIT="${{ steps.build.outputs.BUILD_EXIT_CODE }}"
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          echo "=== Releasing tag: $TAG ==="
          echo "BUILD_EXIT_CODE: $BUILD_EXIT"
          echo "APK_PATH: '$APK_PATH'"

          echo "1. Deleting existing release if it exists..."
          gh release delete "$TAG" --yes 2>&1 || echo "No existing release to delete (expected)"

          echo "2. Creating new release..."
          gh release create "$TAG" --title "$TAG" --generate-notes 2>&1

          echo "3. Uploading web build..."
          gh release upload "$TAG" cova-vault.zip --clobber 2>&1

          echo "4. Uploading APK (if exists)..."
          if [ -n "${APK_PATH:-}" ] && [ -f "$APK_PATH" ]; then
            echo "   APK found: $APK_PATH"
            gh release upload "$TAG" "$APK_PATH" --clobber 2>&1
          else
            echo "   No APK to upload (expected if build failed)"
          fi

          echo "=== Release created ==="
          gh release view "$TAG" --json name,assets 2>&1
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
