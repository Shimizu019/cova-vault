name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0-beta)'
        required: true
        default: 'v0.1.0-beta'

permissions:
  contents: write
env:
  JAVA_TOOL_OPTIONS: "-Xbootclasspath/a:/home/runner/.jaxb/jaxb-api.jar:/home/runner/.jaxb/jaxb-runtime.jar:/home/runner/.jaxb/jaxb-core.jar:/home/runner/.jaxb/istack-commons-runtime.jar:/home/runner/.jaxb/javax.activation.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Package web build
        run: cd dist && zip -r ../cova-vault.zip .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download JAXB for Java 11+ compatibility
        run: |
          mkdir -p ~/.jaxb
          curl -sL -o ~/.jaxb/jaxb-api.jar https://repo1.maven.org/maven2/javax/xml/bind/jaxb-api/2.3.1/jaxb-api-2.3.1.jar
          curl -sL -o ~/.jaxb/jaxb-runtime.jar https://repo1.maven.org/maven2/org/glassfish/jaxb/jaxb-runtime/2.3.1/jaxb-runtime-2.3.1.jar
          curl -sL -o ~/.jaxb/jaxb-core.jar https://repo1.maven.org/maven2/org/glassfish/jaxb/jaxb-core/2.3.0.1/jaxb-core-2.3.0.1.jar
          curl -sL -o ~/.jaxb/istack-commons-runtime.jar https://repo1.maven.org/maven2/com/sun/istack/istack-commons-runtime/3.0.1/istack-commons-runtime-3.0.1.jar
          curl -sL -o ~/.jaxb/javax.activation.jar https://repo1.maven.org/maven2/com/sun/activation/javax.activation/1.2.0/javax.activation-1.2.0.jar
          echo "JAXB downloaded: $(ls -la ~/.jaxb/)"
        shell: bash

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'

      - name: Sync Capacitor
        run: npx cap sync android
        shell: bash

      - name: Build APK
        id: build_apk
        env:
          COVA_VERSION_CODE: ${{ github.run_number }}
          COVA_VERSION_NAME: ${{ github.ref_name }}
        run: |
          # versionName = release tag without the leading "v" (e.g. 0.1.8-beta)
          export COVA_VERSION_NAME="${COVA_VERSION_NAME#v}"
          echo "Building with versionName=$COVA_VERSION_NAME versionCode=$COVA_VERSION_CODE"
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug -x lint --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "build_exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          echo "=== APK files ==="
          find . -name '*.apk' -type f 2>/dev/null || echo "No APK files found"
        shell: bash
        continue-on-error: true

      - name: Save build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log

      - name: Set APK path
        id: find_apk
        if: always()
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -1 || true)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android -name '*.apk' -type f 2>/dev/null | head -1 || true)
          fi
          echo "apk_path=${APK_PATH:-}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Generate changelog
        id: changelog
        if: always()
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          case "$TAG" in
            v0.1.1-beta)
              CHANGELOG="Fixed mobile storage initialization to prevent crashes"
              CHANGELOG+=$'\nImproved configuration file formatting'
              CHANGELOG+=$'\nUpdated APK naming to include the version tag'
              ;;
            v0.1.2-beta)
              CHANGELOG="Fixed fire-and-forget writes in native storage adapter (Preferences.set was not awaited)"
              CHANGELOG+=$'\nAdded fallback read from Capacitor Preferences if cache miss'
              CHANGELOG+=$'\nFixed async getItem in authStorage and vaultStorage'
              ;;
            v0.1.3-beta)
              CHANGELOG="Fixed critical persistence bugs causing data loss on app restart:"
              CHANGELOG+=$'\n- Fire-and-forget writes in native storage (Preferences.set/remove now awaited)'
              CHANGELOG+=$'\n- Missing await in vaultStorage.setItem, getOrCreateVaultSalt, setVaultSalt, reencryptVault'
              CHANGELOG+=$'\n- Added comprehensive debug logging across storage, vaultStorage, encryptedPersist, and Lock rehydration'
              CHANGELOG+=$'\n- Manual rehydrateStores() after vault unlock with detailed per-store logging'
              CHANGELOG+=$'\n- Fixed store initialization timing: initStorage() now runs before any store imports via dynamic import'
              ;;
            v0.1.4-beta)
              CHANGELOG="Fixed critical data persistence bug causing all user data (Credentials, Wallet, Savings, Notes, Tasks) to disappear after app restart:"
              CHANGELOG+=$'\n- Root cause: Zustand persist middleware calls storage.setItem() synchronously, but native Capacitor Preferences writes were async and fire-and-forget'
              CHANGELOG+=$'\n- Fix: Native storage adapter now synchronous with background write queue - caches immediately, queues Preferences.set() for async completion'
              CHANGELOG+=$'\n- All 5 data stores (Credentials, Notes, Tasks, Wallet, Savings) now persist correctly across full app termination/restart'
              CHANGELOG+=$'\n- Added comprehensive debug logging to trace: store name, key, save started/completed, item count, native write success/failure, encryption/decryption, rehydration'
              ;;
            v0.1.8-beta)
              CHANGELOG="Persistence diagnostics: verify the save → logout → restart → unlock lifecycle on-device"
              CHANGELOG+=$'\n- New Settings → Diagnostics section and standalone /diagnostics page reachable from the Lock screen'
              CHANGELOG+=$'\n- 3-phase probe: Phase 1 writes sample data + logs out, Phase 2 verifies native storage after force-close (before unlock), Phase 3 verifies rehydration after unlock'
              CHANGELOG+=$'\n- Stage-by-stage pass/fail for: native write, Preferences.read, decrypt, store rehydrate, UI display — with no secrets logged'
              CHANGELOG+=$'\n- Raw Capacitor Preferences inspection table with presence/size/hash per storage key'
              CHANGELOG+=$'\n- Build identity stamping: every APK/footer now shows version, build number, commit SHA, and build time'
              CHANGELOG+=$'\n- APK versionCode/versionName now stamped from the release tag in CI'
              CHANGELOG+=$'\n- Fixed mojibake characters in Wallet (₱ peso sign, · separator)'
              ;;
            v0.1.0)
              CHANGELOG="PeraLog: category-specific Add Expense form"
              CHANGELOG+=$'\n- Category is now the first field when adding an Expense transaction'
              CHANGELOG+=$'\n- Description examples adapt to the selected category (Food: Burger, Fried Chicken, Rice, Coffee; Transportation: Jeep, Tricycle, Bus, Taxi, UV Express, Motorcycle; plus examples for every other expense category)'
              CHANGELOG+=$'\n- Amount label is now category-specific: Price Food, Price Transportation, Price School, and so on'
              CHANGELOG+=$'\n- Cash Given, Date, Time, Note, balance calculations, history, and the Income form are unchanged'
              CHANGELOG+=$'\n- First stable, official release of Cova Vault'
              ;;
            *)
              CHANGELOG="Bug fixes and improvements"
              ;;
          esac
          printf 'changelog<<EOF\n%s\nEOF\n' "$CHANGELOG" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create GitHub Release
        if: always()
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          BUILD_EXIT="${{ steps.build_apk.outputs.build_exit_code }}"
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          CHANGELOG="${{ steps.changelog.outputs.changelog }}"
          echo "=== Releasing tag: $TAG ==="
          echo "BUILD_EXIT_CODE: $BUILD_EXIT"
          echo "APK_PATH: '$APK_PATH'"

          echo "1. Deleting existing release if it exists..."
          gh release delete "$TAG" --yes 2>&1 || echo "No existing release to delete (expected)"

          echo "2. Creating new release..."
          # NOTE: heredoc delimiter must be UNQUOTED so ${CHANGELOG} expands
          # into the real release notes (quoted 'EOF' writes the placeholder literally).
          if [[ "$TAG" == *-beta* ]]; then
          cat > release-notes.md << EOF
          🚀 Welcome to Cova Vault ${{ env.TAG }}
          This is a beta testing release of Cova Vault — a secure, all-in-one personal vault app where you can keep your passwords, notes, tasks, finances, savings goals, and more in one organized place.

          This beta build is being shared to test the app's features, check that everything is working smoothly, and discover any issues that still need to be fixed. Some features may still change or have bugs, and your feedback is very welcome!

          📌 What is Cova Vault?
          Cova Vault is a privacy-focused personal vault application designed to help you organize your daily life securely. It runs locally on your device with no cloud sync required, keeping your data in your own hands.

          ✨ Main Features
          🔐 Credentials — Store and manage your passwords securely
          📝 Notes — Keep quick notes, ideas, and references
          ✅ Tasks — Track your to-dos and schedules
          💰 PeraLog (Finance) — Track income, expenses, budgets, and balance
          🎯 Savings — Set savings goals and monitor your progress
          📁 Folders — Organize everything with easy navigation
          ⭐ Favorites — Quick access to your most-used items
          📅 Calendar & Schedule — Keep track of dates and deadlines
          🔑 Password Generator — Create strong, secure passwords
          📊 Activity Log — See everything happening in your vault
          📱 Mobile-Ready — Works great on phones and tablets

          🔧 What's New in ${{ env.TAG }}
          ${CHANGELOG}
          ⚠️ Persistence verification
          The five-store regression passes with real stores and encryption across separate Node processes using mock Capacitor Preferences. Hydration preserves the saved blobs. Android native storage and the installed APK force-close test have NOT yet been verified on a real device. Back up important data before testing; previously overwritten records may not be recoverable.

          ⚠️ Beta Notice
          This is a beta release, so some features may not be fully finished yet. You may experience bugs, missing features, or changes in future updates. Please report any issues you find so we can make Cova Vault better!
          EOF
          else
          cat > release-notes.md << EOF
          🎉 Cova Vault ${{ env.TAG }} — Official Release
          The first stable, official release of Cova Vault — a secure, all-in-one personal vault app where you can keep your passwords, notes, tasks, finances, savings goals, and more in one organized place.

          After several beta iterations, Cova Vault is now ready for everyday use. Thank you to everyone who tested the beta builds and shared feedback!

          📌 What is Cova Vault?
          Cova Vault is a privacy-focused personal vault application designed to help you organize your daily life securely. It runs locally on your device with no cloud sync required, keeping your data in your own hands.

          ✨ Main Features
          🔐 Credentials — Store and manage your passwords securely
          📝 Notes — Keep quick notes, ideas, and references
          ✅ Tasks — Track your to-dos and schedules
          💰 PeraLog (Finance) — Track income, expenses, budgets, and balance
          🎯 Savings — Set savings goals and monitor your progress
          📁 Folders — Organize everything with easy navigation
          ⭐ Favorites — Quick access to your most-used items
          📅 Calendar & Schedule — Keep track of dates and deadlines
          🔑 Password Generator — Create strong, secure passwords
          📊 Activity Log — See everything happening in your vault
          📱 Mobile-Ready — Works great on phones and tablets

          🔧 What's New in ${{ env.TAG }}
          ${CHANGELOG}
          📥 Downloads
          cova-vault.zip — Web build (host it on any static server)
          app-CovaVault-${{ env.TAG }}.apk — Android app

          🙏 Thank you for using Cova Vault! Please report any issues you find so we can keep improving the app.
          EOF
          fi
          RELEASE_FLAGS=()
          if [[ "$TAG" == *-beta* ]]; then RELEASE_FLAGS+=(--prerelease); fi
          gh release create "$TAG" --title "$TAG" -F release-notes.md "${RELEASE_FLAGS[@]}" 2>&1

          echo "3. Uploading web build..."
          gh release upload "$TAG" cova-vault.zip --clobber 2>&1

          echo "4. Uploading APK (if exists)..."
          if [ -n "${APK_PATH:-}" ] && [ -f "$APK_PATH" ]; then
            echo "   APK found: $APK_PATH"
            APK_NAME="app-CovaVault-${TAG}.apk"
            cp "$APK_PATH" "$APK_NAME"
            gh release upload "$TAG" "$APK_NAME" --clobber 2>&1
          else
            echo "   No APK to upload (expected if build failed)"
          fi

          echo "=== Release created ==="
          gh release view "$TAG" --json name,assets 2>&1
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name || inputs.tag }}